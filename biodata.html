<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata - Yayan Hidayatulloh</title>
  <!-- memanggil file CSS yang sama dengan halaman index -->
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

  <!-- bagian header template -->
  <header id="header-utama">
    <div class="container">
      <a href="index.html" class="logo">YH<span>.</span></a>
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="biodata.html" class="btn btn-dark">Biodata</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- akhir bagian header template -->

  <main class="container" id="konten-biodata">
    <section class="form-section" id="bagian-formulir">
      <p class="label">Halaman Biodata</p>
      <h2>Formulir Biodata</h2>
      <p class="form-intro">Isi data diri berikut dengan lengkap, lalu tekan tombol Kirim.</p>

      <form id="form-biodata" class="form-card" action="#" method="post">

        <!-- Data diri -->
        <fieldset class="form-group" id="grup-data-diri">
          <legend>Data Diri</legend>

          <div class="form-row">
            <label for="nama" class="form-label">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" class="form-input" placeholder="Masukkan nama lengkap" required>
          </div>

          <div class="form-row">
            <label for="nim" class="form-label">NIM</label>
            <input type="text" id="nim" name="nim" class="form-input" placeholder="Masukkan NIM" required>
          </div>

          <div class="form-row">
            <label for="tempat-lahir" class="form-label">Tempat Lahir</label>
            <input type="text" id="tempat-lahir" name="tempat_lahir" class="form-input" placeholder="Contoh: Jakarta">
          </div>

          <div class="form-row">
            <label for="tanggal-lahir" class="form-label">Tanggal Lahir</label>
            <input type="date" id="tanggal-lahir" name="tanggal_lahir" class="form-input">
          </div>

          <div class="form-row">
            <span class="form-label">Jenis Kelamin</span>
            <div class="form-options" id="opsi-jenis-kelamin">
              <label class="form-option"><input type="radio" id="pria" name="jenis_kelamin" value="Laki-laki"> Laki-laki</label>
              <label class="form-option"><input type="radio" id="wanita" name="jenis_kelamin" value="Perempuan"> Perempuan</label>
            </div>
          </div>

          <div class="form-row">
            <label for="agama" class="form-label">Agama</label>
            <select id="agama" name="agama" class="form-input">
              <option value="">-- Pilih agama --</option>
              <option value="Islam">Islam</option>
              <option value="Kristen">Kristen</option>
              <option value="Katolik">Katolik</option>
              <option value="Hindu">Hindu</option>
              <option value="Buddha">Buddha</option>
              <option value="Konghucu">Konghucu</option>
            </select>
          </div>
        </fieldset>

        <!-- Kontak -->
        <fieldset class="form-group" id="grup-kontak">
          <legend>Kontak</legend>

          <div class="form-row">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="nama@email.com" required>
          </div>

          <div class="form-row">
            <label for="telepon" class="form-label">No. Telepon</label>
            <input type="tel" id="telepon" name="telepon" class="form-input" placeholder="08xxxxxxxxxx">
          </div>

          <div class="form-row">
            <label for="alamat" class="form-label">Alamat</label>
            <textarea id="alamat" name="alamat" class="form-input" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
          </div>
        </fieldset>

        <!-- Pendidikan -->
        <fieldset class="form-group" id="grup-pendidikan">
          <legend>Pendidikan</legend>

          <div class="form-row">
            <label for="prodi" class="form-label">Program Studi</label>
            <select id="prodi" name="prodi" class="form-input">
              <option value="">-- Pilih program studi --</option>
              <option value="Teknik Informatika">Teknik Informatika</option>
              <option value="Sistem Informasi">Sistem Informasi</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <div class="form-row">
            <label for="semester" class="form-label">Semester</label>
            <input type="number" id="semester" name="semester" class="form-input" min="1" max="14" placeholder="Contoh: 3">
          </div>
        </fieldset>

        <!-- Minat -->
        <fieldset class="form-group" id="grup-minat">
          <legend>Minat &amp; Hobi</legend>

          <div class="form-row">
            <span class="form-label">Hobi</span>
            <div class="form-options" id="opsi-hobi">
              <label class="form-option"><input type="checkbox" id="hobi-coding" name="hobi" value="Coding"> Coding</label>
              <label class="form-option"><input type="checkbox" id="hobi-membaca" name="hobi" value="Membaca"> Membaca</label>
              <label class="form-option"><input type="checkbox" id="hobi-olahraga" name="hobi" value="Olahraga"> Olahraga</label>
              <label class="form-option"><input type="checkbox" id="hobi-musik" name="hobi" value="Musik"> Musik</label>
            </div>
          </div>

          <div class="form-row">
            <label for="tentang" class="form-label">Tentang Saya</label>
            <textarea id="tentang" name="tentang" class="form-input" rows="4" placeholder="Ceritakan singkat tentang diri kamu"></textarea>
          </div>
        </fieldset>

        <!-- Tombol -->
        <div class="form-actions" id="aksi-formulir">
          <button type="submit" id="tombol-kirim" class="btn btn-dark">Kirim</button>
          <button type="reset" id="tombol-reset" class="btn btn-lime">Reset</button>
        </div>

      </form>
    </section>
  </main>

  <!-- bagian footer template -->
  <footer id="footer-utama">
    <div class="container">
      <span>© Yayan Hidayatulloh · Tugas Pemrograman Web</span>
      <a href="index.html">Kembali ke Beranda</a>
    </div>
  </footer>
  <!-- akhir bagian footer template -->

</body>
</html>
